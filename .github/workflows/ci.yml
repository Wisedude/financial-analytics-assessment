name: Build and test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  backend:
    name: Backend tests and coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run backend tests and generate JaCoCo report
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Publish test results
        if: ${{ always() }}
        uses: dorny/test-reporter@v2
        with:
          name: Backend JUnit tests
          path: backend/target/surefire-reports/TEST-*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload test and coverage reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-and-coverage-reports
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/jacoco.xml
            backend/target/site/jacoco/index.html
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage to Codecov
        if: ${{ always() && hashFiles('backend/target/site/jacoco/jacoco.xml') != '' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/target/site/jacoco/jacoco.xml
          flags: backend
          name: fintrack-backend
          fail_ci_if_error: false

      - name: Add coverage and test summary
        if: ${{ always() && hashFiles('backend/target/site/jacoco/jacoco.xml') != '' }}
        run: |
          python - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          root = ET.parse("backend/target/site/jacoco/jacoco.xml").getroot()
          line = next(counter for counter in root.findall("counter") if counter.attrib["type"] == "LINE")
          covered = int(line.attrib["covered"])
          missed = int(line.attrib["missed"])
          total = covered + missed
          coverage = 100 * covered / total if total else 100
          tests = failures = errors = skipped = 0
          for report in glob.glob("backend/target/surefire-reports/TEST-*.xml"):
              suite = ET.parse(report).getroot()
              tests += int(suite.attrib.get("tests", 0))
              failures += int(suite.attrib.get("failures", 0))
              errors += int(suite.attrib.get("errors", 0))
              skipped += int(suite.attrib.get("skipped", 0))

          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Backend quality results\n\n")
              summary.write(f"- **JUnit tests:** {tests} total, {failures} failures, {errors} errors, {skipped} skipped\n")
              summary.write(f"- **JaCoCo line coverage:** {coverage:.1f}% ({covered}/{total} lines)\n")
              summary.write("- **Required line coverage:** 80% (enforced by Maven)\n")
          PY

  frontend:
    name: Frontend type check and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check and build frontend
        working-directory: frontend
        run: npm run build
