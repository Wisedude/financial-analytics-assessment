spring:
  application:
    name: financial-analytics-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fintrack}
    username: ${SPRING_DATASOURCE_USERNAME:fintrack}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: 9501
  address: 0.0.0.0
app:
  token-expiry-minutes: ${TOKEN_EXPIRY_MINUTES:120}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  demo-user:
    enabled: ${APP_DEMO_USER_ENABLED:false}
    name: ${DEMO_USER_NAME:Demo Customer}
    email: ${DEMO_USER_EMAIL:demo@fintrack.local}
    password: ${DEMO_USER_PASSWORD:}
logging:
  level:
    root: INFO
    com.example.financialanalytics: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [requestId=%X{requestId:-}] %logger{36} - %msg%n"
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
